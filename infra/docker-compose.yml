version: '3.3'

volumes:
  pg_data:
  static:
  media:
  frontend:

services:
  db:
    image: postgres:14.22
    env_file: ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ../backend/
    env_file: ../.env
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      - db  
      
  frontend:
    build: ../frontend
    env_file: ../.env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
      - media:/media
  gateway:
    build: ../infra/
    env_file: ../.env
    ports:
      - 8000:80
    volumes:
      - static:/staticfiles
      - media:/media
      - ../docs/:/usr/share/nginx/html/api/docs/
      - frontend:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend    

      