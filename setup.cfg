[flake8]
ignore =
    W503,
    F811,
    I
exclude =
    tests/,
    */migrations/,
    data/
    */venv/,
    */env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
profile = black
src_paths = backend
known_first_party = api,bookmark,recipes,users
known_third_party = django,django_filters,djoser,rest_framework
lines_after_imports = 2