volumes:
  pg_data_production:
  static_volume:
  media_volume:
  frontend_volume:

services:
  db:
    image: postgres:14.22
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: sergey345bk/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/media
    depends_on:
      - db
  frontend:
    image: sergey345bk/foodgram_frontend
    env_file: .env
    command: sh -c "cp -r /app/build/. /frontend_static/ && tail -f /dev/null"
    restart: unless-stopped
    volumes:
      - frontend_volume:/frontend_static
      - media_volume:/media
  gateway:
    image: sergey345bk/foodgram_gateway
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - static_volume:/staticfiles
      - frontend_volume:/usr/share/nginx/html
      - media_volume:/media
      - ./docs:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
      - frontend
