volumes:
  pg_data_production:
  backend_static:
  media_volume:
  frontend_static:

services:
  db:
    image: postgres:14.22
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: sergey345bk/foodgram_backend
    env_file: .env
    volumes:
      - backend_static:/app/collected_static
      - media_volume:/media
    depends_on:
      - db  
  frontend:
    image: sergey345bk/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - frontend_static:/frontend_static
      - media_volume:/media
  gateway:
    image: sergey345bk/foodgram_gateway
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - backend_static:/staticfiles
      - frontend_static:/usr/share/nginx/html
      - media_volume:/media
      - ./docs:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
      - frontend  
