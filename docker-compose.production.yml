volumes:
  pg_data_production:
  static_volume:
  media_volume:
  frontend_volume:
  docs_volume:
services:
  db:
    image: postgres:14.22
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: sergey345bk/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/media
    depends_on:
      - db  
  frontend:
    image: sergey345bk/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
      - media_volume:/media
  gateway:
    image: sergey345bk/foodgram_gateway
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - static_volume:/staticfiles
      - media_volume:/media
      - docs_volume:/usr/share/nginx/html/api/docs/
      - frontend_volume:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend  
